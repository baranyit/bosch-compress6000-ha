name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]" -C editable_mode=compat
      - name: ruff check
        run: uv run --no-sync ruff check .
      - name: ruff format
        run: uv run --no-sync ruff format --check .
      - name: mypy
        run: uv run --no-sync mypy

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[test]" -C editable_mode=compat
      - name: pytest
        # CI never reaches a real gateway: the transport is an in-process fake.
        run: uv run --no-sync python -m pytest
